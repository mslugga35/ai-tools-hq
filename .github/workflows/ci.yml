name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: cd site && npm ci
      # Advisory: design-system linter reports pre-existing hardcoded-color/font debt
      # (40 errors as of 2026-07-07). Non-blocking until that debt is cleaned up.
      - run: cd site && npm run lint:design-system || true
